<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>GameChat — Your gaming ecosystem</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

html{scroll-behavior:smooth}

body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;
  background:#000;
  color:#f5f5f7;
  overflow-x:hidden;
}

body::selection{
  background:rgba(120,95,255,.45);
  color:#fff;
}

a{
  color:inherit;
  text-decoration:none;
}

button,input{
  font:inherit;
}

/* NAV */

.nav{
  position:sticky;
  top:0;
  z-index:100;
  height:58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 6%;
  background:rgba(0,0,0,.62);
  backdrop-filter:blur(28px) saturate(180%);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
  border-bottom:1px solid rgba(255,255,255,.08);
  transition:background .4s ease,border-color .4s ease,box-shadow .4s ease;
}

.nav:hover{
  background:rgba(8,8,10,.78);
  border-color:rgba(255,255,255,.13);
  box-shadow:0 10px 40px rgba(0,0,0,.18);
}

.brand{
  font-size:20px;
  font-weight:700;
  letter-spacing:-.7px;
  transition:transform .3s ease;
}

.brand:hover{
  transform:scale(1.02);
}

.brand b{
  color:#7c5cff;
  text-shadow:0 0 20px rgba(124,92,255,.7);
}

.navlinks{
  display:flex;
  align-items:center;
  gap:28px;
  font-size:13px;
  color:#b8b8bd;
}

.navlinks a{
  position:relative;
  transition:color .25s ease,opacity .25s ease,transform .25s ease;
}

.navlinks a:not(.navbutton)::after{
  content:"";
  position:absolute;
  left:50%;
  bottom:-7px;
  width:0;
  height:1px;
  background:#fff;
  transform:translateX(-50%);
  transition:width .3s ease;
}

.navlinks a:hover{
  color:#fff;
  transform:translateY(-1px);
}

.navlinks a:not(.navbutton):hover::after{
  width:100%;
}

.navbutton{
  padding:9px 17px;
  border-radius:999px;
  background:rgba(255,255,255,.96);
  color:#000!important;
  font-weight:600;
  box-shadow:
    0 4px 20px rgba(255,255,255,.08),
    inset 0 0 0 1px rgba(255,255,255,.3);
  transition:transform .3s ease,box-shadow .3s ease,background .3s ease;
}

.navbutton:hover{
  transform:translateY(-2px) scale(1.02)!important;
  background:#fff;
  box-shadow:
    0 8px 30px rgba(255,255,255,.16),
    0 0 30px rgba(255,255,255,.08);
}

/* HERO */

.hero{
  min-height:88vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 25%,rgba(91,64,255,.38),transparent 35%),
    radial-gradient(circle at 20% 80%,rgba(0,160,255,.18),transparent 30%),
    #000;
}

.hero::before{
  content:"";
  position:absolute;
  width:650px;
  height:650px;
  border-radius:50%;
  background:
    radial-gradient(
      circle,
      rgba(105,72,255,.22),
      rgba(105,72,255,.08) 35%,
      transparent 70%
    );
  filter:blur(50px);
  animation:heroGlow 8s ease-in-out infinite alternate;
}

.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      120deg,
      transparent 20%,
      rgba(255,255,255,.025) 45%,
      transparent 70%
    );
  transform:translateX(-100%);
  animation:heroSweep 10s ease-in-out infinite;
  pointer-events:none;
}

.hero-content{
  position:relative;
  z-index:2;
  max-width:1000px;
  padding:80px 25px;
  animation:heroContentIn 1.1s cubic-bezier(.2,.8,.2,1) both;
}

.kicker{
  color:#aaa;
  font-size:17px;
  margin-bottom:22px;
  animation:fadeUp .8s .05s cubic-bezier(.2,.8,.2,1) both;
}

.hero h1{
  font-size:clamp(64px,9vw,128px);
  line-height:.92;
  letter-spacing:-7px;
  font-weight:700;
  text-wrap:balance;
  animation:fadeUp 1s .12s cubic-bezier(.2,.8,.2,1) both;
}

.gradient{
  background:
    linear-gradient(
      90deg,
      #fff 0%,
      #d7d0ff 22%,
      #8d79ff 55%,
      #50bfff 100%
    );
  background-size:180% auto;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  animation:gradientMove 7s ease-in-out infinite alternate;
}

.hero p{
  max-width:680px;
  margin:35px auto;
  color:#a1a1a6;
  font-size:22px;
  line-height:1.45;
  animation:fadeUp 1s .24s cubic-bezier(.2,.8,.2,1) both;
}

.ctas{
  display:flex;
  justify-content:center;
  gap:14px;
  flex-wrap:wrap;
  animation:fadeUp 1s .36s cubic-bezier(.2,.8,.2,1) both;
}

.primary,
.secondary{
  padding:15px 25px;
  border-radius:999px;
  font-size:16px;
  font-weight:600;
  transition:
    transform .35s cubic-bezier(.2,.8,.2,1),
    box-shadow .35s ease,
    background .35s ease,
    border-color .35s ease;
}

.primary{
  background:#fff;
  color:#000;
  box-shadow:0 10px 35px rgba(255,255,255,.08);
}

.secondary{
  border:1px solid rgba(255,255,255,.28);
  color:#fff;
  background:rgba(255,255,255,.035);
  backdrop-filter:blur(15px);
}

.primary:hover,
.secondary:hover{
  transform:translateY(-4px) scale(1.015);
}

.primary:hover{
  box-shadow:
    0 15px 45px rgba(255,255,255,.15),
    0 0 30px rgba(255,255,255,.05);
}

.secondary:hover{
  border-color:rgba(255,255,255,.55);
  background:rgba(255,255,255,.08);
}

/* SECTIONS */

.section{
  padding:120px 7%;
}

.section.light{
  background:
    radial-gradient(circle at 10% 0%,rgba(120,100,255,.06),transparent 25%),
    #f5f5f7;
  color:#111;
}

.section-title{
  max-width:850px;
  margin-bottom:70px;
}

.section-title .small{
  font-size:18px;
  color:#777;
  margin-bottom:15px;
  letter-spacing:-.2px;
}

.section-title h2{
  font-size:clamp(45px,7vw,88px);
  line-height:.95;
  letter-spacing:-5px;
  text-wrap:balance;
}

.section-title p{
  margin-top:25px;
  font-size:20px;
  color:#777;
  max-width:650px;
  line-height:1.5;
}

/* SETUP */

.setup-hero{
  min-height:650px;
  border-radius:38px;
  padding:70px;
  display:flex;
  align-items:flex-end;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 70% 20%,#6c4fff,transparent 28%),
    radial-gradient(circle at 20% 80%,#0c6bff,transparent 30%),
    linear-gradient(135deg,#15151c,#020203);
  box-shadow:
    0 30px 100px rgba(0,0,0,.35),
    inset 0 0 0 1px rgba(255,255,255,.07);
  transition:
    transform .7s cubic-bezier(.2,.8,.2,1),
    box-shadow .7s ease;
}

.setup-hero:hover{
  transform:translateY(-5px);
  box-shadow:
    0 45px 120px rgba(0,0,0,.45),
    0 0 80px rgba(90,70,255,.08),
    inset 0 0 0 1px rgba(255,255,255,.1);
}

.setup-hero::before{
  content:"";
  position:absolute;
  width:600px;
  height:600px;
  right:-100px;
  top:-160px;
  border-radius:50%;
  background:
    radial-gradient(circle,rgba(255,255,255,.12),transparent 62%);
  filter:blur(25px);
  animation:setupOrb 9s ease-in-out infinite alternate;
}

.setup-hero::after{
  content:"";
  position:absolute;
  width:450px;
  height:450px;
  right:12%;
  top:15%;
  border-radius:50%;
  background:rgba(255,255,255,.08);
  filter:blur(5px);
  box-shadow:
    0 0 100px rgba(109,78,255,.7),
    inset 0 0 100px rgba(255,255,255,.08);
  animation:orbPulse 6s ease-in-out infinite alternate;
}

.setup-content{
  position:relative;
  z-index:2;
}

.setup-content span{
  color:#b4b4bd;
  font-size:18px;
}

.setup-content h3{
  margin-top:15px;
  font-size:clamp(45px,6vw,78px);
  letter-spacing:-4px;
}

.setup-content p{
  margin-top:20px;
  max-width:600px;
  color:#aaa;
  font-size:20px;
}

/* HARDWARE */

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.card{
  min-height:330px;
  border-radius:30px;
  padding:35px;
  background:
    linear-gradient(145deg,rgba(255,255,255,.025),rgba(255,255,255,.01)),
    #111;
  border:1px solid rgba(255,255,255,.08);
  transition:
    transform .5s cubic-bezier(.2,.8,.2,1),
    border-color .4s ease,
    box-shadow .5s ease,
    background .5s ease;
  position:relative;
  overflow:hidden;
  isolation:isolate;
}

.card::before{
  content:"";
  position:absolute;
  width:250px;
  height:250px;
  left:var(--mx,50%);
  top:var(--my,50%);
  transform:translate(-50%,-50%);
  background:
    radial-gradient(circle,rgba(120,90,255,.18),transparent 65%);
  filter:blur(20px);
  opacity:0;
  transition:opacity .4s ease;
  pointer-events:none;
}

.card:hover{
  transform:translateY(-9px) scale(1.012);
  border-color:rgba(255,255,255,.2);
  box-shadow:
    0 25px 70px rgba(0,0,0,.22),
    0 0 50px rgba(100,80,255,.07);
}

.card:hover::before{
  opacity:1;
}

.card::after{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  right:-60px;
  bottom:-70px;
  background:rgba(110,80,255,.2);
  filter:blur(50px);
  z-index:-1;
  transition:transform .6s ease,opacity .6s ease;
}

.card:hover::after{
  transform:scale(1.35);
  opacity:.9;
}

.card .icon{
  font-size:38px;
  margin-bottom:45px;
  transition:
    transform .4s cubic-bezier(.2,.8,.2,1),
    text-shadow .4s ease;
}

.card:hover .icon{
  transform:scale(1.12) translateY(-3px);
  text-shadow:0 0 25px rgba(120,100,255,.45);
}

.card h3{
  font-size:28px;
  letter-spacing:-1px;
}

.card p{
  margin-top:13px;
  color:#999;
  line-height:1.5;
}

.spec{
  margin-top:30px;
  color:#fff;
  font-size:15px;
  font-weight:500;
}

.light .card{
  background:
    linear-gradient(145deg,rgba(255,255,255,.9),rgba(255,255,255,.7)),
    #fff;
  border-color:rgba(0,0,0,.08);
  box-shadow:0 10px 35px rgba(0,0,0,.04);
}

.light .card:hover{
  border-color:rgba(0,0,0,.15);
  box-shadow:0 25px 70px rgba(0,0,0,.1);
}

.light .card p{
  color:#777;
}

.light .card .spec{
  color:#111;
}

/* PERFORMANCE */

.performance{
  background:
    radial-gradient(circle at 80% 20%,rgba(89,62,255,.25),transparent 30%),
    radial-gradient(circle at 10% 90%,rgba(0,140,255,.08),transparent 25%),
    #050507;
}

.performance-grid{
  display:grid;
  grid-template-columns:2fr 1fr 1fr;
  gap:18px;
}

.performance-card{
  min-height:330px;
  border-radius:30px;
  padding:40px;
  background:
    linear-gradient(145deg,#17171d,#08080a);
  border:1px solid rgba(255,255,255,.08);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  transition:
    transform .5s cubic-bezier(.2,.8,.2,1),
    border-color .4s ease,
    box-shadow .5s ease;
}

.performance-card:hover{
  transform:translateY(-8px);
  border-color:rgba(255,255,255,.18);
  box-shadow:
    0 30px 80px rgba(0,0,0,.35),
    0 0 50px rgba(90,70,255,.06);
}

.performance-card.big{
  min-height:450px;
}

.performance-card h3{
  font-size:42px;
  letter-spacing:-2px;
}

.performance-card .number{
  font-size:clamp(60px,7vw,110px);
  font-weight:700;
  letter-spacing:-6px;
  background:linear-gradient(135deg,#fff,#aaa);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.performance-card p{
  color:#999;
  font-size:18px;
}

.performance-card small{
  color:#777;
}

/* GAMES */

.games{
  background:
    radial-gradient(circle at 90% 10%,rgba(110,90,255,.06),transparent 25%),
    #f5f5f7;
  color:#111;
}

.game-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:20px;
}

.game{
  min-height:450px;
  border-radius:35px;
  padding:40px;
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:flex-end;
  background:
    linear-gradient(135deg,#16161b,#050505);
  color:white;
  box-shadow:0 15px 45px rgba(0,0,0,.08);
  transition:
    transform .6s cubic-bezier(.2,.8,.2,1),
    box-shadow .6s ease;
}

.game::before{
  content:"";
  position:absolute;
  inset:-30%;
  background:
    radial-gradient(
      circle at var(--gx,50%) var(--gy,50%),
      rgba(255,255,255,.12),
      transparent 25%
    );
  opacity:0;
  transition:opacity .5s ease;
  pointer-events:none;
}

.game:hover{
  transform:translateY(-10px) scale(1.012);
  box-shadow:0 30px 80px rgba(0,0,0,.18);
}

.game:hover::before{
  opacity:1;
}

.game:nth-child(2){
  background:
    radial-gradient(circle at 80% 20%,rgba(80,120,255,.45),transparent 35%),
    #101016;
}

.game:nth-child(3){
  background:
    radial-gradient(circle at 30% 30%,rgba(255,50,50,.25),transparent 35%),
    #101010;
}

.game:nth-child(4){
  background:
    radial-gradient(circle at 70% 40%,rgba(255,170,50,.3),transparent 35%),
    #12100c;
}

.game-info{
  position:relative;
  z-index:2;
  transition:transform .5s cubic-bezier(.2,.8,.2,1);
}

.game:hover .game-info{
  transform:translateY(-5px);
}

.game-info span{
  color:#aaa;
  font-size:15px;
}

.game-info h3{
  margin-top:10px;
  font-size:45px;
  letter-spacing:-2px;
}

.game-info p{
  margin-top:12px;
  color:#aaa;
}

/* CHAT */

.chat-section{
  padding:130px 7%;
  background:
    radial-gradient(circle at 50% 0%,rgba(89,65,255,.3),transparent 35%),
    radial-gradient(circle at 20% 100%,rgba(0,130,255,.08),transparent 30%),
    #000;
}

.chat{
  max-width:1050px;
  margin:auto;
  border-radius:35px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.1);
  background:
    linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.015)),
    #0d0d10;
  box-shadow:
    0 30px 100px rgba(0,0,0,.6),
    0 0 80px rgba(80,60,255,.06);
  backdrop-filter:blur(30px);
  -webkit-backdrop-filter:blur(30px);
  transition:border-color .4s ease,box-shadow .5s ease;
}

.chat:hover{
  border-color:rgba(255,255,255,.16);
  box-shadow:
    0 35px 110px rgba(0,0,0,.65),
    0 0 100px rgba(80,60,255,.09);
}

.chat-head{
  padding:25px 30px;
  border-bottom:1px solid rgba(255,255,255,.08);
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(255,255,255,.015);
}

.chat-title{
  font-size:20px;
  font-weight:600;
}

.status{
  font-size:13px;
  color:#65d98a;
  text-shadow:0 0 12px rgba(101,217,138,.35);
}

.messages{
  min-height:360px;
  max-height:500px;
  overflow-y:auto;
  padding:30px;
  scrollbar-width:thin;
  scrollbar-color:#333 transparent;
}

.message{
  max-width:75%;
  padding:16px 19px;
  border-radius:20px;
  margin-bottom:15px;
  line-height:1.45;
  animation:messageIn .4s cubic-bezier(.2,.8,.2,1) both;
}

.bot{
  background:
    linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.035));
  color:#ddd;
  border:1px solid rgba(255,255,255,.05);
}

.user{
  margin-left:auto;
  background:#fff;
  color:#000;
  box-shadow:0 8px 25px rgba(255,255,255,.05);
}

.quick-actions{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  padding:0 30px 22px;
}

.quick-btn{
  border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.035);
  color:#ddd;
  padding:10px 14px;
  border-radius:999px;
  font-size:13px;
  cursor:pointer;
  transition:
    transform .3s ease,
    background .3s ease,
    border-color .3s ease,
    color .3s ease;
}

.quick-btn:hover{
  transform:translateY(-2px);
  background:rgba(255,255,255,.09);
  border-color:rgba(255,255,255,.25);
  color:#fff;
}

.chat-input{
  display:flex;
  gap:10px;
  padding:18px;
  border-top:1px solid rgba(255,255,255,.08);
  background:rgba(0,0,0,.18);
}

.chat-input input{
  flex:1;
  padding:15px 18px;
  border-radius:15px;
  border:1px solid #333;
  background:rgba(21,21,25,.85);
  color:white;
  outline:none;
  font-size:15px;
  transition:
    border-color .3s ease,
    box-shadow .3s ease,
    background .3s ease;
}

.chat-input input:focus{
  border-color:rgba(130,105,255,.65);
  background:#17171c;
  box-shadow:0 0 0 4px rgba(100,80,255,.08);
}

.chat-input button{
  border:0;
  border-radius:15px;
  padding:0 24px;
  background:white;
  color:black;
  font-weight:600;
  cursor:pointer;
  transition:
    transform .3s ease,
    box-shadow .3s ease;
}

.chat-input button:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 25px rgba(255,255,255,.12);
}

.toast{
  position:fixed;
  left:50%;
  bottom:30px;
  z-index:999;
  transform:translate(-50%,30px);
  opacity:0;
  padding:13px 18px;
  border-radius:999px;
  background:rgba(25,25,28,.86);
  color:white;
  border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(20px);
  box-shadow:0 15px 50px rgba(0,0,0,.35);
  pointer-events:none;
  transition:
    opacity .35s ease,
    transform .35s ease;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* FOOTER */

footer{
  padding:60px 7%;
  border-top:1px solid #222;
  color:#777;
  display:flex;
  justify-content:space-between;
  gap:20px;
}

footer strong{
  color:white;
}

/* REVEAL */

.reveal{
  opacity:0;
  transform:translateY(35px);
  transition:
    opacity .9s cubic-bezier(.2,.8,.2,1),
    transform .9s cubic-bezier(.2,.8,.2,1);
}

.reveal.visible{
  opacity:1;
  transform:translateY(0);
}

/* ANIMATIONS */

@keyframes heroGlow{
  from{
    transform:scale(.9) translate(-2%,-1%);
    opacity:.7;
  }
  to{
    transform:scale(1.1) translate(3%,2%);
    opacity:1;
  }
}

@keyframes heroSweep{
  0%,45%{transform:translateX(-100%)}
  65%,100%{transform:translateX(100%)}
}

@keyframes heroContentIn{
  from{
    opacity:0;
    transform:translateY(25px) scale(.98);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(22px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes gradientMove{
  from{background-position:0% 50%}
  to{background-position:100% 50%}
}

@keyframes setupOrb{
  from{
    transform:translate(0,0) scale(.9);
  }
  to{
    transform:translate(-50px,35px) scale(1.1);
  }
}

@keyframes orbPulse{
  from{
    transform:scale(.92);
    opacity:.55;
  }
  to{
    transform:scale(1.08);
    opacity:.85;
  }
}

@keyframes messageIn{
  from{
    opacity:0;
    transform:translateY(8px) scale(.98);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

/* TABLET */

@media (max-width:850px){

  .nav{
    padding:0 20px;
  }

  .navlinks{
    gap:10px;
  }

  .navlinks a:not(.navbutton){
    display:none;
  }

  .hero h1{
    letter-spacing:-4px;
  }

  .hero p{
    font-size:18px;
  }

  .section{
